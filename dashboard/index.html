<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slippi Highlights Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    .stats {
      display: flex;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      padding: 1rem;
      height: calc(100vh - 64px);
    }
    .sidebar {
      background: var(--panel);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .filters {
      padding: 1rem;
      border-bottom: 1px solid #334155;
    }
    .filters input, .filters select {
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
    }
    .clip-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .clip-item {
      padding: 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 0.5rem;
    }
    .clip-item:hover, .clip-item.active {
      background: #334155;
    }
    .clip-item .title {
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }
    .clip-item .meta {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 0.5rem;
    }
    .badge.pending { background: #334155; color: var(--muted); }
    .badge.approved { background: #14532d; color: var(--success); }
    .badge.rejected { background: #450a0a; color: var(--danger); }
    .main {
      background: var(--panel);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .video-wrap {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      max-width: 100%;
      max-height: 100%;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 2rem;
    }
    .details {
      padding: 1rem 1.5rem;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .details h2 { margin: 0 0 0.25rem; font-size: 1rem; }
    .details p { margin: 0; color: var(--muted); font-size: 0.875rem; }
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }
    .btn.approve { background: var(--success); }
    .btn.reject { background: var(--danger); }
    .btn.reset { background: #475569; }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Slippi Highlights Dashboard</h1>
    <div class="stats">
      <span id="total-count">0 clips</span>
      <span id="approved-count">0 aprobados</span>
      <span id="rejected-count">0 rechazados</span>
    </div>
  </header>
  <div class="container">
    <aside class="sidebar">
      <div class="filters">
        <input type="text" id="search" placeholder="Buscar clip..." />
        <select id="status-filter">
          <option value="all">Todos</option>
          <option value="pending">Pendientes</option>
          <option value="approved">Aprobados</option>
          <option value="rejected">Rechazados</option>
        </select>
      </div>
      <div class="clip-list" id="clip-list"></div>
    </aside>
    <main class="main">
      <div class="video-wrap" id="video-wrap">
        <div class="empty">Selecciona un clip para reproducir</div>
      </div>
      <div class="details" id="details" style="display:none">
        <div>
          <h2 id="detail-title"></h2>
          <p id="detail-meta"></p>
        </div>
        <div class="actions">
          <button class="btn approve" onclick="setStatus('approved')">✅ Aprobar</button>
          <button class="btn reject" onclick="setStatus('rejected')">❌ Rechazar</button>
          <button class="btn reset" onclick="setStatus('pending')">↩ Reset</button>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
